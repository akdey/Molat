openapi: 3.0.0
info:
  title: Molat Personal Library Assistant
  description: Voice assistant skill to search personal library shelves, check reading streaks, and log reading progress directly to Google Sheets.
  version: 2.0.0
servers:
  - url: https://a-k-dey-molat.hf.space/api/v1
    description: Production Molat Backend on Hugging Face Spaces

paths:
  /books:
    get:
      operationId: findBooks
      summary: Search personal library shelves for books and physical locations
      description: Search books by title or author to find their shelf location (e.g., Home Shelf, Living Room), reading status (READING, UNREAD, COMPLETED), and book_id.
      parameters:
        - name: search
          in: query
          required: false
          description: Title or author of the book to find
          schema:
            type: string
        - name: reading_status
          in: query
          required: false
          description: Filter books by reading status (READING, UNREAD, COMPLETED)
          schema:
            type: string
            enum: [READING, UNREAD, COMPLETED, PAUSED, ABANDONED]
      responses:
        '200':
          description: List of books matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      type: object
                      properties:
                        book_id:
                          type: string
                        title:
                          type: string
                        authors:
                          type: string
                        location:
                          type: string
                          description: Physical shelf location in the house
                        reading_status:
                          type: string
                        rating:
                          type: number
                          nullable: true

  /reading/streak-summary:
    get:
      operationId: getStreakSummary
      summary: Check current reading streak, daily velocity, and progress
      description: Returns the user's active streak in days, longest streak record, pages read today, and 14-day velocity.
      parameters:
        - name: goal
          in: query
          required: false
          description: Daily reading goal in pages (default 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Streak summary normalized in IST
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_streak_days:
                    type: integer
                  longest_streak_days:
                    type: integer
                  today_pages:
                    type: integer
                  daily_goal_pages:
                    type: integer
                  reading_velocity_pages_per_day:
                    type: number

  /reading/logs:
    post:
      operationId: logReadingSession
      summary: Log a reading session for a book to Google Sheets
      description: Records start_page and end_page for a book, updates the streak, and saves the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - book_id
                - start_page
                - end_page
              properties:
                book_id:
                  type: string
                  description: The unique ID of the book (found via findBooks)
                start_page:
                  type: integer
                  description: The starting page number of the session
                end_page:
                  type: integer
                  description: The ending page number of the session
                duration_minutes:
                  type: integer
                  default: 0
                  description: Time spent reading in minutes
                session_note:
                  type: string
                  default: ""
                  description: Optional quick reflection or note
                finished_book:
                  type: boolean
                  default: false
                  description: Set to true if this session completes the book
      responses:
        '201':
          description: Reading session successfully recorded
