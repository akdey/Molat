name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:

concurrency:
  group: hf-spaces-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test & Sync to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11 with uv
        run: uv python install 3.11

      - name: Sync dependencies & run test suite with uv
        run: |
          cd backend
          uv sync
          uv run pytest -v

      - name: Prepare Deployment Directory & Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE || 'a-k-dey/Molat' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions to add it."
            exit 1
          fi

          echo "🚀 Preparing deployment package for Hugging Face Space: $HF_SPACE"
          mkdir -p deploy_hf
          cp -r backend/* deploy_hf/

          cd deploy_hf
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main
          git add .
          git commit -m "Deploy to Hugging Face [skip ci]"

          # Push using Hugging Face x-token authentication
          git remote add origin "https://x-token:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push -f origin main

          echo "✅ Successfully pushed to https://huggingface.co/spaces/${HF_SPACE}"
